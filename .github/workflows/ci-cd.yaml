name: EKS Blue-Green CI/CD

on:
  push:
    branches:
      - master

  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: bluegreen-demo
  EKS_CLUSTER_NAME: blue-green-cluster
  K8S_NAMESPACE: bluegreen
  HELM_RELEASE_NAME: bluegreen-app

permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================
  # 1. BUILD APPLICATION
  # ==========================================
  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application
        working-directory: app
        run: mvn -B clean package -DskipTests


  # ==========================================
  # 2. BUILD AND PUSH IMAGE TO ECR
  # ==========================================
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: app
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


  # ==========================================
  # 3. DEPLOY TO EKS
  # ==========================================
  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy application with Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} \
            ./helm/bluegreen-app \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ needs.docker.outputs.registry }}/${{ env.ECR_REPOSITORY }} \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always \
            --set database.username="${{ secrets.DB_USERNAME }}" \
            --set database.password="${{ secrets.DB_PASSWORD }}"

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}
          kubectl get service -n ${{ env.K8S_NAMESPACE }}
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}
